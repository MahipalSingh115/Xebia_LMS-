$kind: http-request
name: Get Enrollment Analytics
method: GET
url: '{{baseUrl}}/api/dashboard/analytics/enrollments'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Analytics is an object", () => pm.expect(pm.response.json()).to.be.an('object'));
