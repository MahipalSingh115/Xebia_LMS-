$kind: http-request
name: Get Quiz By ID
method: GET
url: '{{baseUrl}}/api/quizzes/{{quizId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Quiz has id", () => pm.expect(pm.response.json()).to.have.property('id'));
