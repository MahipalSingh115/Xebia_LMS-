$kind: http-request
name: Get Quiz Result
method: GET
url: '{{baseUrl}}/api/quizzes/{{quizId}}/result'
order: 7000
queryParams:
  - key: studentId
    value: '{{studentId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 404", () => pm.expect(pm.response.code).to.be.oneOf([200, 404]));
      if (pm.response.code === 200) {
        pm.test("Result has score", () => pm.expect(pm.response.json()).to.have.property('score'));
      }
