$kind: http-request
name: Create Quiz
method: POST
url: '{{baseUrl}}/api/quizzes'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"name":"Test Quiz","courseId":{{courseId}},"passingScore":60,"status":"DRAFT"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("Quiz has id", () => pm.expect(pm.response.json()).to.have.property('id'));
      pm.test("Name matches", () => pm.expect(pm.response.json().name).to.equal("Test Quiz"));
      pm.environment.set("newQuizId", pm.response.json().id);
