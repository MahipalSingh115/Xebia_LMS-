$kind: http-request
name: Get Modules By Course
method: GET
url: '{{baseUrl}}/api/modules'
order: 2000
queryParams:
  - key: courseId
    value: '{{courseId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is array", () => pm.expect(pm.response.json()).to.be.an('array'));
