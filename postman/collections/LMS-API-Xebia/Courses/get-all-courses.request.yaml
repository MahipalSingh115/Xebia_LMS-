$kind: http-request
name: Get All Courses
method: GET
url: '{{baseUrl}}/api/courses'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is array", () => pm.expect(pm.response.json()).to.be.an('array'));
      if (pm.response.json().length > 0) {
        pm.test("Course has id and title", () => {
          const course = pm.response.json()[0];
          pm.expect(course).to.have.property('id');
          pm.expect(course).to.have.property('title');
        });
        pm.environment.set("courseId", pm.response.json()[0].id);
      }
