$kind: http-request
name: Get Event By ID
method: GET
url: '{{baseUrl}}/api/events/{{eventId}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Event has id", () => pm.expect(pm.response.json()).to.have.property('id'));
