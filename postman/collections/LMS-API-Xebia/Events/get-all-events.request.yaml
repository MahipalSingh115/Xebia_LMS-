$kind: http-request
name: Get All Events
method: GET
url: '{{baseUrl}}/api/events'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("Response is object or array", () => pm.expect(body).to.satisfy(b => typeof b === 'object' && b !== null));
      const list = Array.isArray(body) ? body : (body.content || body.data || []);
      if (list.length > 0) {
        pm.test("Event has id and title", () => {
          pm.expect(list[0]).to.have.property('id');
        });
        pm.environment.set("eventId", list[0].id);
      }
