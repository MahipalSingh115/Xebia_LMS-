$kind: http-request
name: Create Event
method: POST
url: '{{baseUrl}}/api/events'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title":"Test Event","description":"A test event","startDate":"2025-06-01","endDate":"2025-06-02","registrationDeadline":"2025-05-30","maxParticipants":50}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("Event has id", () => pm.expect(pm.response.json()).to.have.property('id'));
      pm.test("Title matches", () => pm.expect(pm.response.json().title).to.equal("Test Event"));
      pm.environment.set("newEventId", pm.response.json().id);
