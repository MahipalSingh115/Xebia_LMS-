$kind: http-request
name: Create SubModule
method: POST
url: '{{baseUrl}}/api/submodules'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title":"Test SubModule","moduleId":{{moduleId}},"orderIndex":1}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("SubModule has id", () => pm.expect(pm.response.json()).to.have.property('id'));
      pm.environment.set("newSubModuleId", pm.response.json().id);
