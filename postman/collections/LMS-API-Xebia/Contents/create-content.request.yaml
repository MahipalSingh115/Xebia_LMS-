$kind: http-request
name: Create Content
method: POST
url: '{{baseUrl}}/api/contents'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"title":"Test Content","subModuleId":{{subModuleId}},"type":"VIDEO","url":"https://example.com/video.mp4"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("Content has id", () => pm.expect(pm.response.json()).to.have.property('id'));
      pm.environment.set("newContentId", pm.response.json().id);
