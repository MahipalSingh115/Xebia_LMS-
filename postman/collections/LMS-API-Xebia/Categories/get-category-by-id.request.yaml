$kind: http-request
name: Get Category By ID
method: GET
url: '{{baseUrl}}/api/categories/{{categoryId}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Category has id", () => pm.expect(pm.response.json()).to.have.property('id'));
      pm.test("Category id matches", () => pm.expect(String(pm.response.json().id)).to.equal(pm.environment.get("categoryId")));
