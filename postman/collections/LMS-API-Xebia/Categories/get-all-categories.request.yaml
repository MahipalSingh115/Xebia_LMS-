$kind: http-request
name: Get All Categories
method: GET
url: '{{baseUrl}}/api/categories'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response is array", () => pm.expect(pm.response.json()).to.be.an('array'));
      pm.test("Content-Type is JSON", () => pm.response.to.have.header("Content-Type", /json/));
      if (pm.response.json().length > 0) {
        pm.test("Category has id and name", () => {
          const cat = pm.response.json()[0];
          pm.expect(cat).to.have.property('id');
          pm.expect(cat).to.have.property('name');
        });
        pm.environment.set("categoryId", pm.response.json()[0].id);
      }
