$kind: http-request
name: Create Batch
method: POST
url: '{{baseUrl}}/api/batches'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"name":"Batch 2025","startDate":"2025-01-01","endDate":"2025-06-30","status":"ACTIVE"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 or 201", () => pm.expect(pm.response.code).to.be.oneOf([200, 201]));
      pm.test("Batch has id", () => pm.expect(pm.response.json()).to.have.property('id'));
      pm.environment.set("newBatchId", pm.response.json().id);
