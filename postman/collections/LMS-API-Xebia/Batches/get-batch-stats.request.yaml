$kind: http-request
name: Get Batch Stats
method: GET
url: '{{baseUrl}}/api/batches/stats'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Stats is an object", () => pm.expect(pm.response.json()).to.be.an('object'));
