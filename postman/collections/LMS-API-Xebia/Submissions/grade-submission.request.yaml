$kind: http-request
name: Grade Submission
method: POST
url: '{{baseUrl}}/api/submissions/{{newSubmissionId}}/grade'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"grade":85,"feedback":"Good work!"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Graded submission has grade", () => pm.expect(pm.response.json()).to.have.property('grade'));
